name: souq_syria
description: "سوق سوريا الشامل 2026 - تطبيق إعلانات مبوبة متكامل"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase Backend
  supabase_flutter: ^2.5.6

  # UI / Fonts & Images
  google_fonts: ^6.2.1
  carousel_slider: ^4.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2

  # Utilities & Image Processing
  intl: ^0.20.2
  equatable: ^2.0.5
  cross_file: ^0.3.4+2
  flutter_image_compress: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/